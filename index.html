<body>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
  <style>
    /* Layout: ポスターと同じ、黒い地に赤い明朝の大見出し。クイズとアンケートだけは「スポットライトが当たった」明るい灰色の紙面にして、黒との対比をつくる。1カラムのスマホ縦画面が基準。参加者向けのサイトで、運営画面は別サイトに分けた。 */
    :root {
      --bg: #0a0a0b;
      --surface: #131315;
      --raised: #1d1d20;
      --ink: #f2f0ee;
      --muted: #a3a0a2;
      --line: #333236;
      --red: #c1272d;
      --red-text: #ee5256;
      --red-soft: #351214;
      --on-red: #ffffff;
      --paper: #e3e3e3;
      --paper-ink: #111111;
      --paper-sub: #4d4d4d;
      --paper-line: #b5b5b5;
      --ok: #6fd392;
      --ok-soft: #123226;
      --warn: #f0b95a;
      --warn-soft: #3a2d12;
      --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
      --font-num: "Cormorant Garamond", "Shippori Mincho B1", serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.3px);
      background-size: 6px 6px;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.8;
      padding-block: 12px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      font-weight: 800;
      margin: 0;
      line-height: 1.4;
      letter-spacing: .06em;
      text-wrap: balance;
    }

    p {
      margin: 0;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--red-text);
      outline-offset: 2px;
    }

    .proto {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .proto-btn {
      display: block;
      margin: 6px auto 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--muted);
      border-radius: 4px;
      font-size: 12px;
      padding: 6px 12px;
      font-family: inherit;
      cursor: pointer;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      border: 1px solid var(--line);
    }

    .band {
      background: var(--red);
      color: var(--on-red);
      padding: 26px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 0 0 50% 50% / 0 0 22px 22px;
      text-align: center;
    }

    .band .tag {
      font-family: var(--font-num);
      font-size: 14px;
      letter-spacing: .3em;
      opacity: .9;
    }

    .band h1 {
      font-size: 34px;
      line-height: 1.3;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      font-size: 18px;
    }

    .info {
      display: grid;
      grid-template-columns: 5.5em 1fr;
      gap: 10px 10px;
      font-size: 14px;
      margin: 0;
    }

    .info dt {
      color: var(--red-text);
      font-family: var(--font-display);
      font-weight: 700;
    }

    .info dd {
      margin: 0;
      min-width: 0;
    }

    .btn {
      display: block;
      border: 0;
      background: var(--red);
      color: var(--on-red);
      font-family: var(--font-display);
      font-weight: 800;
      padding: 14px 18px;
      min-height: 54px;
      font-size: 17px;
      width: 100%;
      letter-spacing: .12em;
      text-align: center;
      text-decoration: none;
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 700;
      letter-spacing: .06em;
    }

    .btn:disabled {
      background: var(--raised);
      color: var(--muted);
      cursor: not-allowed;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
    }

    .footer {
      text-align: center;
      font-family: var(--font-display);
      letter-spacing: .3em;
      color: var(--muted);
      font-size: 13px;
    }

    .progress {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .progress .n {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 60px;
      line-height: 1;
    }

    .progress .n small {
      font-size: 26px;
      color: var(--muted);
    }

    .bar {
      height: 6px;
      background: var(--raised);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--red);
      transition: width .4s;
    }

    .stamps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .slot {
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      border: 1px dashed var(--muted);
      color: var(--muted);
    }

    .slot.got {
      border: 0;
      color: var(--on-red);
      background: var(--red);
      transform: rotate(-8deg);
      box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4.5px var(--red-text);
    }

    .slot.got:nth-child(even) {
      transform: rotate(7deg);
    }

    .qno {
      font-family: var(--font-num);
      font-weight: 600;
      letter-spacing: .25em;
      font-size: 15px;
      color: var(--red);
    }

    .qno.dark {
      color: var(--red-text);
    }

    .spot {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 14px 10px 10px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .spot .no {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      border: 1px dashed var(--muted);
      color: var(--muted);
    }

    .spot.done .no {
      border: 0;
      background: var(--red);
      color: var(--on-red);
    }

    .spot.now {
      border-color: var(--red-text);
    }

    .spot.now .no {
      border: 2px solid var(--red-text);
      color: var(--red-text);
    }

    .spot b {
      font-family: var(--font-display);
      font-weight: 700;
      display: block;
      letter-spacing: .06em;
    }

    .spot span.s {
      font-size: 13px;
      color: var(--muted);
    }

    .chip {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      background: var(--raised);
      color: var(--muted);
    }

    .chip.ok {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .chip.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .chip.red {
      background: var(--red-soft);
      color: var(--red-text);
    }

    .sim {
      border: 1px dashed var(--line);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sim .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sim button {
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
      padding: 8px 12px;
      min-height: 44px;
      font-weight: 700;
    }

    /* クイズとアンケート：スポットライトの紙面 */
    .paper {
      background: var(--paper);
      color: var(--paper-ink);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .paper .small {
      color: var(--paper-sub);
    }

    .q {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.8;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice {
      text-align: left;
      border: 1.5px solid var(--paper-line);
      background: #f3f3f3;
      color: var(--paper-ink);
      padding: 14px;
      min-height: 54px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 500;
    }

    .choice .k {
      width: 28px;
      height: 28px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--paper-ink);
      color: #fff;
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 16px;
    }

    .choice[aria-pressed="true"] {
      background: var(--red);
      color: var(--on-red);
      border-color: var(--red);
    }

    .choice[aria-pressed="true"] .k {
      background: #fff;
      color: var(--red);
    }

    .imgph {
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      border: 1.5px dashed var(--paper-line);
      display: grid;
      place-items: center;
      color: var(--paper-sub);
      font-size: 13px;
      text-align: center;
      padding: 8px;
    }

    .imgph svg {
      width: 38%;
      height: auto;
      max-height: 100%;
    }

    .imggrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .imggrid .choice {
      flex-direction: column;
      align-items: stretch;
      padding: 10px;
    }

    .imggrid .imgph {
      aspect-ratio: 4 / 3;
      border-color: currentColor;
      color: inherit;
      opacity: .85;
    }

    .photo {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .imggrid .lab {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .result {
      text-align: center;
      align-items: center;
    }

    .big-stamp {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: var(--red);
      color: var(--on-red);
      display: grid;
      place-items: center;
      transform: rotate(-9deg);
      box-shadow: inset 0 0 0 6px var(--surface), inset 0 0 0 8px var(--red-text);
      animation: press .45s ease-out;
    }

    .big-stamp b {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 56px;
      line-height: 1;
      display: block;
    }

    .big-stamp span {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .3em;
    }

    @keyframes press {
      from {
        transform: rotate(-9deg) scale(1.6);
        opacity: 0;
      }

      to {
        transform: rotate(-9deg) scale(1);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .big-stamp {
        animation: none;
      }

      .bar i {
        transition: none;
      }
    }

    .verdict {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 28px;
      letter-spacing: .2em;
    }

    .verdict.ok {
      color: var(--ok);
    }

    .verdict.ng {
      color: var(--warn);
    }

    .expl {
      background: var(--raised);
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      width: 100%;
    }

    .expl.hint {
      border-left: 3px solid var(--red);
    }

    .expl h3 {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12px;
      color: var(--red-text);
      letter-spacing: .2em;
      margin-bottom: 4px;
    }

    .draft {
      font-size: 12px;
      color: var(--warn);
    }

    .notice {
      border-left: 3px solid var(--red);
      background: var(--red-soft);
      padding: 10px 12px;
      font-size: 14px;
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input[type=text] {
      font: inherit;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
      min-height: 48px;
      width: 100%;
    }

    input.sid {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: .2em;
    }

    .err {
      color: var(--red-text);
      font-size: 13px;
      min-height: 1.5em;
    }

    .agree {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 14px;
      cursor: pointer;
    }

    .agree input {
      width: 24px;
      height: 24px;
      flex: none;
      accent-color: var(--red);
      margin: 2px 0 0;
    }

    /* 運営ページ（同じページの中の別の画面） */
    .wrap.wide {
      max-width: 1040px;
    }

    .head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 16px;
      border-bottom: 2px solid var(--red);
      padding-bottom: 8px;
    }

    .head h1 {
      font-size: 22px;
    }

    .head span {
      font-family: var(--font-num);
      letter-spacing: .25em;
      font-size: 14px;
      color: var(--red-text);
    }

    input[type=search],
    input[type=password] {
      font: inherit;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
      min-height: 48px;
      width: 100%;
    }

    .login {
      max-width: 380px;
      margin: 0 auto;
      width: 100%;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px 14px;
    }

    .stat b {
      display: block;
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 38px;
      line-height: 1.1;
    }

    .stat span {
      font-size: 12px;
      color: var(--muted);
    }

    .svrow {
      display: grid;
      grid-template-columns: 13em 1fr 2.5em;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .svrow b {
      text-align: right;
      font-family: var(--font-num);
      font-size: 17px;
    }

    .svgroup {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 4px;
    }

    .members {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-left: 0;
      margin: 0;
      list-style: none;
    }

    .who {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 15px;
      padding: 1px 10px;
      background: var(--raised);
      border: 1px solid var(--line);
    }

    .who small {
      font-family: var(--font-body);
      font-weight: 400;
      color: var(--muted);
      font-size: 12px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tools input[type=search] {
      flex: 1 1 220px;
      width: auto;
    }

    .seg {
      display: flex;
      flex-wrap: wrap;
      border: 1px solid var(--line);
    }

    .seg button {
      border: 0;
      background: var(--surface);
      color: var(--muted);
      padding: 8px 12px;
      min-height: 44px;
      font-weight: 700;
    }

    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    .tablebox {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      background: var(--raised);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.id,
    td.num {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }

    tr.me td {
      background: var(--red-soft);
    }

    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px dashed var(--muted);
      vertical-align: middle;
    }

    .dot.on {
      border: 0;
      background: var(--red);
    }

    .xbtn {
      border: 0;
      padding: 8px 12px;
      min-height: 40px;
      font-weight: 700;
      background: var(--ink);
      color: var(--bg);
    }

    .xbtn.confirm {
      background: var(--red);
      color: var(--on-red);
    }

    .xbtn:disabled {
      background: transparent;
      color: var(--muted);
      cursor: default;
    }

    /* 通信中の表示 */
    .wait {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: rgba(10, 10, 11, .72);
    }

    .wait div {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: .2em;
    }

    .wait i {
      width: 64px;
      height: 64px;
      border-radius: 50%;

    async function api(action, data) {
      let res;

      } catch (e) { throw Object.assign(new Error("network"), { code: "network" }); }
      if (!res.ok) throw Object.assign(new Error(res.error), { code: res.error, res });
      return res;

    let cached = null;

    function save() { try { localStorage.setItem(LS, JSON.stringify({ sid: st.sid, state: { sid: st.sid, sv: st.sv, stamps: st.stamps, hint: st.hint, prize: st.prize, at: st.prizeAt } })); } catch (e) { } }

    function forget() { st.sid = ""; st.sv = null; st.stamps = {}; st.hint = ""; try { localStorage.removeItem(LS); } catch (e) { } }

    /* ---- 運営ページ（#admin で開く。合言葉の確認と記録の読み書きはサーバー側） ---- */
    const AD_N = 5;
    let adSt = { loggedIn: false, pw: "", rows: [], updated: "", err: "", filter: "all", q: "", confirmId: null, csv: false };
    function adRows() {
      return adSt.rows.map(p => { const s = p.s.map(v => v === null ? 0 : 1); const total = s.reduce((a, b) => a + b, 0); return { ...p, s, ok: p.s, total, elig: !!p.sid && total >= 1 }; });
    }
    function adFiltered() {
      let r = adRows();
      if (adSt.filter === "elig") r = r.filter(p => p.elig);
      if (adSt.filter === "done") r = r.filter(p => p.total === AD_N);
      if (adSt.filter === "unex") r = r.filter(p => p.total === AD_N && p.prize !== "done");
      if (adSt.q) r = r.filter(p => (p.id + " " + (p.sid || "")).toLowerCase().includes(adSt.q.toLowerCase()));
      return r;
    }
    function adCsv() {
      const head = ["participant_id", ...Array.from({ length: AD_N }, (_, i) => "spot" + (i + 1)), "total", "student_id", "lottery_eligible", "survey_choice", "participation_prize"];
      const body = adFiltered().map(p => [p.id, ...p.ok.map(v => v === null ? "" : v ? "正解" : "不正解"), p.total, p.sid || "", p.elig ? "yes" : "no", p.sv === null || p.sv === undefined ? "" : p.sv + 1, p.total === AD_N ? (p.prize === "done" ? "渡し済み" : "未交換") : "対象外"]);
      return [head, ...body].map(r => r.join(",")).join("\n");
    }
    function adLoginView() {
      return `
  <div class="head"><h1>運営ログイン</h1><span>挑戦状</span></div>
  <section class="card login">
    <form id="adlogin">
      <label class="f" for="adpw">合言葉<input id="adpw" type="password" autocomplete="off" placeholder="運営に伝えられた合言葉"></label>
      <p class="err" role="alert">${esc(adSt.err)}</p>
      <button class="btn" type="submit">${st.busy ? "確認中…" : "ログイン"}</button>
    </form>
    <p class="small">合言葉を知っている運営だけが入れます。</p>
  </section>
  <button class="btn ghost" type="button" data-act="adexit">参加者の画面にもどる</button>`;
    }
    function adDashView() {
      const all = adRows();
      const total = all.length, elig = all.filter(p => p.elig).length, comp = all.filter(p => p.total === AD_N).length, done = all.filter(p => p.total === AD_N && p.prize === "done").length;
      const svN = all.filter(p => typeof p.sv === "number").length;
      const list = adFiltered();
      return `
  <div class="head"><h1>運営ダッシュボード</h1><div class="tools"><button class="xbtn" type="button" data-act="ad_reload">${st.busy ? "更新中…" : "最新にする"}</button><button class="xbtn" type="button" data-act="adexit">参加者の画面へ</button></div></div>
  <p class="small">最終更新：${esc(adSt.updated)}（スプレッドシート「participants」から読み込み）</p>
  <div class="stats">
    <div class="stat"><b>${total}</b><span>参加者（学籍番号を入力）</span></div>
    <div class="stat"><b>${elig}</b><span>抽選の対象（1問以上）</span></div>
    <div class="stat"><b>${comp}</b><span>5つ達成（参加賞の対象）</span></div>
    <div class="stat"><b>${done}</b><span>参加賞 渡し済み</span></div>
    <div class="stat"><b>${comp - done}</b><span>参加賞 未交換</span></div>
  </div>

  <section class="card">
    <h2>アンケート：${esc(SURVEY.q)}</h2>
    ${SURVEY.c.map((c, i) => {
        const m = all.filter(p => p.sv === i), pct = svN ? Math.round(m.length / svN * 100) : 0;
        return `<div class="svgroup">
        <div class="svrow"><span>${i + 1}. ${esc(c)}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${m.length}</b></div>
      </div>`;
      }).join("")}
    <p class="small">回答した人：${svN}人。誰が何を選んだかは、下の表の「アンケート」の列で見られます。</p>
  </section>

  <div class="tools">
    <input type="search" id="adq" placeholder="参加者番号・学籍番号で探す" value="${esc(adSt.q)}" aria-label="参加者番号・学籍番号で探す">
    <div class="seg" role="group" aria-label="絞り込み">
      <button type="button" data-f="all" aria-pressed="${adSt.filter === "all"}">全員</button>
      <button type="button" data-f="elig" aria-pressed="${adSt.filter === "elig"}">抽選の対象</button>
      <button type="button" data-f="done" aria-pressed="${adSt.filter === "done"}">5つ達成</button>
      <button type="button" data-f="unex" aria-pressed="${adSt.filter === "unex"}">参加賞 未交換</button>
    </div>
    <button class="xbtn" type="button" data-act="ad_csv">CSVを表示</button>
  </div>
  ${adSt.err ? `<p class="notice" role="alert">${esc(adSt.err)}</p>` : ""}
  <div class="tablebox"><table>
    <thead><tr><th>参加者番号</th>${Array.from({ length: AD_N }, (_, i) => `<th>謎${i + 1}</th>`).join("")}<th>合計</th><th>応募</th><th>学籍番号</th><th>アンケート</th><th>参加賞</th><th></th></tr></thead>
    <tbody>${list.length ? list.map(p => {
        const comp = p.total === AD_N, ex = p.prize === "done";
        return `<tr>
        <td class="id">${esc(p.id)}</td>
        ${p.ok.map(v => `<td><span class="dot ${v !== null ? "on" : ""}" title="${v === null ? "未回答" : v ? "正解" : "不正解"}" aria-label="${v === null ? "未回答" : v ? "正解" : "不正解"}"></span></td>`).join("")}
        <td class="num">${p.total}/${AD_N}</td>
        <td>${p.total >= 1 ? '<span class="chip ok">抽選の対象</span>' : '<span class="chip warn">回答なし</span>'}</td>
        <td class="id">${p.sid ? esc(p.sid) : '<span class="small">—</span>'}</td>
        <td>${typeof p.sv === "number" ? `<span class="chip red">${p.sv + 1}</span>` : '<span class="small">—</span>'}</td>
        <td>${!comp ? '<span class="chip">対象外</span>' : ex ? `<span class="chip ok">渡し済み${p.at ? " " + esc(p.at) : ""}</span>` : '<span class="chip warn">未交換</span>'}</td>
        <td>${comp ? (ex ? `<button class="xbtn" disabled>渡し済み</button>` : (adSt.confirmId === p.id ? `<button class="xbtn confirm" data-act="ad_xchg" data-id="${esc(p.id)}">本当に渡した</button>` : `<button class="xbtn" data-act="ad_xask" data-id="${esc(p.id)}">交換済みにする</button>`)) : ""}</td>

      }).join("") : `<tr><td colspan="12" class="small">該当する参加者がいません</td></tr>`}</tbody>
  </table></div>
  <p class="small">謎の列の丸にカーソルを合わせると正解・不正解が出ます。5つ達成した人に参加賞を渡したら「交換済みにする」を押してください。サーバー側でも渡し済みかを確かめるので、別の端末から同時に押しても二重配布になりません。</p>
  ${adSt.csv ? `<div class="card"><h2>CSV（表示中の絞り込み結果）</h2><textarea id="adcsvta" readonly aria-label="CSV">${esc(adCsv())}</textarea><button class="xbtn" type="button" data-act="ad_copycsv" style="align-self:flex-start">コピーする</button><p class="small" id="adcsvmsg" role="status"></p></div>` : ""}`;
    }
    function adminView() { return adSt.loggedIn ? adDashView() : adLoginView(); }
    function adLoad(res) { adSt.rows = res.rows || []; adSt.updated = res.updated || ""; }
    function adBind() {
      const lf = document.getElementById("adlogin");
      if (lf) lf.addEventListener("submit", async e => {
        e.preventDefault();
        if (st.busy) return;
        const pw = document.getElementById("adpw").value;
        await busy(async () => {
          try { adLoad(await api("admin_list", { pw })); adSt.loggedIn = true; adSt.pw = pw; adSt.err = ""; }
          catch (err) { adSt.err = errMsg(err); }
        });
      });
      const q = document.getElementById("adq");
      if (q) q.addEventListener("input", e => { adSt.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("adq"); n.focus(); n.setSelectionRange(pos, pos); });
    }
    async function adAct(a, t) {
      if (a === "ad_xask") { adSt.confirmId = t.dataset.id; return render(); }
      if (a === "ad_xchg") {
        return busy(async () => {
          try { adLoad(await api("admin_exchange", { pw: adSt.pw, id: t.dataset.id })); adSt.err = ""; }
          catch (err) { adSt.err = errMsg(err); if (err.code === "bad_password") adSt.loggedIn = false; }
          adSt.confirmId = null;
        });
      }
      if (a === "ad_reload") {
        return busy(async () => {
          try { adLoad(await api("admin_list", { pw: adSt.pw })); adSt.err = ""; }
          catch (err) { adSt.err = errMsg(err); if (err.code === "bad_password") adSt.loggedIn = false; }
        });
      }
      if (a === "ad_csv") { adSt.csv = !adSt.csv; return render(); }
      if (a === "ad_copycsv") {
        const ta = document.getElementById("adcsvta"), m = document.getElementById("adcsvmsg");
        const fb = () => { ta.select(); m.textContent = "選択しました。コピーしてください。"; };
        try { navigator.clipboard.writeText(ta.value).then(() => m.textContent = "コピーしました。", fb); } catch (err) { fb(); }
      }
    }

    /* ---- 描画とイベント ---- */
    function render() {
      const views = { loading: loadingView, survey: surveyView, top: topView, rally: rallyView, locked: lockedView, quiz: quizView, result: resultView, complete: completeView, apply: applyView, confirm: confirmView, admin: adminView };
      app.innerHTML = (st.msg ? `<p class="notice" role="alert">${esc(st.msg)}</p>` : "") + views[st.screen]();
      app.className = "wrap" + (st.screen === "admin" && adSt.loggedIn ? " wide" : "");
      if (st.busy) {
        app.querySelectorAll("button").forEach(b => b.disabled = true);
        const label = { quiz: "採点しています", confirm: "登録しています", admin: "読み込んでいます" }[st.screen] || "送信しています";
        app.insertAdjacentHTML("beforeend", `<div class="wait" role="status" aria-live="polite"><div><i></i><span>${label}…</span></div></div>`);
      }
      if (st.screen === "admin") adBind();
      const af = document.getElementById("applyform");
      if (af) af.addEventListener("submit", e => {
        e.preventDefault();
        st.stu = document.getElementById("stu").value.trim().normalize("NFKC");
        st.agree = document.getElementById("agree").checked;
        if (!/^[0-9]{8}$/.test(st.stu)) st.err = "学籍番号は、数字8桁で入力してください。";
        else if (!st.agree) st.err = "学籍番号の使いみちへの同意にチェックを入れてください。";
        else { st.err = ""; return go("confirm"); }
        render();
      });
    }
    /* 通信中はボタンを押せなくする */
    async function busy(fn) { st.busy = true; render(); try { await fn(); } finally { st.busy = false; render(); } }

    function defaultScreen() { return !st.sid ? "apply" : st.sv === null ? "survey" : "top"; }

    /* QRコード読み取り：URL の末尾 #q1〜#q5 でその謎を直接開く（学籍番号・アンケートが先） */
    let pending = null;
    function openSpot(id) {
      const n = count();
      if (st.stamps[id]) return go("result", { spot: id });       // 回答済み：結果を再表示（再回答は不可）
      if (id === n + 1) return go("quiz", { spot: id, pick: [] });  // つぎの謎：クイズを開く
      return go("locked", { spot: id });                         // 順番が先の謎：まだ開けない
    }
    function afterReady() { if (pending) { const id = pending; pending = null; return openSpot(id); } go(defaultScreen()); }
    function readHash() {
      if (location.hash === "#admin") return go("admin");
      const m = /^#q([1-5])$/.exec(location.hash); if (!m) return;
      pending = +m[1];
      if (st.screen !== "loading" && st.sid && st.sv !== null) afterReady();
    }
    window.addEventListener("hashchange", readHash);

    /* 起動時：この端末に学籍番号があれば、サーバーから最新の記録を読み込む */
    async function boot() {
      if (location.hash === "#admin") return go("admin");
      const m = /^#q([1-5])$/.exec(location.hash); if (m) pending = +m[1];
      if (!st.sid) return go("apply");
      if (cached) {
        // 写しがあれば、待たずにすぐ表示。最新との照らし合わせは裏で行う
        applyState(cached); cached = null; afterReady();
        refresh();
        return;
      }
      st.screen = "loading"; st.msg = ""; render();
      try { applyState(await api("state", { sid: st.sid })); afterReady(); }
      catch (err) {
        if (err.code === "not_found") { forget(); return go("apply"); }
        st.msg = errMsg(err); render();
      }
    }
    /* 裏でサーバーの最新を読み込む。回答中の画面はじゃましない */
    async function refresh() {
      try {
        const r = await api("state", { sid: st.sid });
        const before = JSON.stringify([st.sv, st.stamps, st.prize]);
        applyState(r);
        if (!st.busy && JSON.stringify([st.sv, st.stamps, st.prize]) !== before && ["top", "rally", "complete", "locked", "survey"].includes(st.screen)) {
          if (st.screen === "survey" && st.sv !== null) return go("top");
          render();
        }
      } catch (err) {
        if (err.code === "not_found" && !st.busy) { forget(); go("apply", { msg: ERR.not_found }); }
        // 通信できないときは、写しのまま続ける（回答を送るときにサーバーが確かめる）
      }
    }

    document.addEventListener("click", async e => {
      const t = e.target.closest("button"); if (!t || st.busy) return;
      if (t.dataset.f) { adSt.filter = t.dataset.f; return render(); }
      const a = t.dataset.act; if (!a) return;
      if (a === "retry") return boot();
      if (a === "adexit") { history.replaceState(null, "", location.pathname + location.search); return st.sid ? go(defaultScreen()) : boot(); }
      if (a.startsWith("ad_")) return adAct(a, t);
      if (a === "svpick") { st.svpick = +t.dataset.i; return render(); }
      if (a === "svsubmit") {
        if (st.svpick === null) return;
        // アンケートは待たずに先へ進み、送信は裏で行う（失敗したら2回までやり直す）
        const choice = st.svpick;
        st.sv = choice; save(); afterReady();
        (async () => {
          for (let i = 0; i < 3; i++) {
            try { const r = await api("survey", { sid: st.sid, choice }); if (!st.busy) { applyState(r); } return; }
            catch (err) { if (err.code === "not_found") { forget(); return go("apply", { msg: ERR.not_found }); } await new Promise(ok => setTimeout(ok, 1500)); }
          }
          st.sv = null; save();   // 送れなかった：次に開いたとき、もう一度アンケートを出す
        })();
        return;
      }
      if (a === "start" || a === "rally") return go("rally");
      if (a === "top") return go("top");
      if (a === "complete") return go("complete");
      if (a === "apply") return go("apply", { err: "" });
      if (a === "submitapply") {
        return busy(async () => {
          try {
            const r = await api("register", { sid: st.stu });
            applyState(r); st.busy = false;
            if (r.existed) st.msg = "";   // 2台目以降：続きから
            afterReady();
          } catch (err) { st.msg = errMsg(err); }
        });
      }
      if (a === "arrive") return openSpot(+t.dataset.id);
      if (a === "pick") {
        const i = +t.dataset.i, s = SPOTS.find(x => x.id === st.spot);
        if (s.type === "multi") st.pick = st.pick.includes(i) ? st.pick.filter(x => x !== i) : [...st.pick, i];
        else st.pick = [i];
        return render();
      }
      if (a === "answer") {
        if (!st.pick.length) return;
        const spot = st.spot;
        return busy(async () => {
          try { applyState(await api("answer", { sid: st.sid, spot, pick: st.pick })); st.busy = false; go("result", { spot }); }   // 回答済みだった場合も、サーバーの記録で結果を出す
          catch (err) {
            if (err.code === "locked" && err.res) { applyState(err.res); st.busy = false; return go("locked", { spot }); }
            if (err.code === "not_found") { forget(); st.busy = false; return go("apply", { msg: ERR.not_found }); }
            st.msg = errMsg(err);
          }
        });
      }
    });
    boot();
  </script>

</body>
