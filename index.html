<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>挑戦状</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
  <style>
    /* Layout: ポスターと同じ、黒い地に赤い明朝の大見出し。クイズだけは「スポットライトが当たった」明るい灰色の紙面にして、黒との対比をつくる。1カラムのスマホ縦画面が基準。 */
    :root {
      --bg: #0a0a0b;
      --surface: #131315;
      --raised: #1d1d20;
      --ink: #f2f0ee;
      --muted: #a3a0a2;
      --line: #333236;
      --red: #c1272d;
      --red-text: #ee5256;
      --red-soft: #351214;
      --on-red: #ffffff;
      --paper: #e3e3e3;
      --paper-ink: #111111;
      --paper-sub: #4d4d4d;
      --paper-line: #b5b5b5;
      --ok: #6fd392;
      --ok-soft: #123226;
      --warn: #f0b95a;
      --warn-soft: #3a2d12;
      --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
      --font-num: "Cormorant Garamond", "Shippori Mincho B1", serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.3px);
      background-size: 6px 6px;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.8;
      padding-block: 12px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .wrap.wide {
      max-width: 980px;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      font-weight: 800;
      margin: 0;
      line-height: 1.4;
      letter-spacing: .06em;
      text-wrap: balance;
    }

    p {
      margin: 0;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--red-text);
      outline-offset: 2px;
    }

    .switch {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 4px;
    }

    .switch button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      font-weight: 700;
      min-height: 40px;
    }

    .switch button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    .proto {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      border: 1px solid var(--line);
    }

    .band {
      background: var(--red);
      color: var(--on-red);
      padding: 26px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 0 0 50% 50% / 0 0 22px 22px;
      text-align: center;
    }

    .band .tag {
      font-family: var(--font-num);
      font-size: 14px;
      letter-spacing: .3em;
      opacity: .9;
    }

    .band h1 {
      font-size: 34px;
      line-height: 1.3;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      font-size: 18px;
    }

    .info {
      display: grid;
      grid-template-columns: 5.5em 1fr;
      gap: 10px 10px;
      font-size: 14px;
      margin: 0;
    }

    .info dt {
      color: var(--red-text);
      font-family: var(--font-display);
      font-weight: 700;
    }

    .info dd {
      margin: 0;
      min-width: 0;
    }

    .btn {
      display: block;
      border: 0;
      background: var(--red);
      color: var(--on-red);
      font-family: var(--font-display);
      font-weight: 800;
      padding: 14px 18px;
      min-height: 54px;
      font-size: 17px;
      width: 100%;
      letter-spacing: .12em;
      text-align: center;
      text-decoration: none;
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 700;
      letter-spacing: .06em;
    }

    .btn:disabled {
      background: var(--raised);
      color: var(--muted);
      cursor: not-allowed;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
    }

    .footer {
      text-align: center;
      font-family: var(--font-display);
      letter-spacing: .3em;
      color: var(--muted);
      font-size: 13px;
    }

    .progress {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .progress .n {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 60px;
      line-height: 1;
    }

    .progress .n small {
      font-size: 26px;
      color: var(--muted);
    }

    .bar {
      height: 6px;
      background: var(--raised);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--red);
      transition: width .4s;
    }

    .stamps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .slot {
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      border: 1px dashed var(--muted);
      color: var(--muted);
    }

    .slot.got {
      border: 0;
      color: var(--on-red);
      background: var(--red);
      transform: rotate(-8deg);
      box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4.5px var(--red-text);
    }

    .slot.got:nth-child(even) {
      transform: rotate(7deg);
    }

    .spot {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 14px 10px 10px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .spot .no {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      border: 1px dashed var(--muted);
      color: var(--muted);
    }

    .spot.done .no {
      border: 0;
      background: var(--red);
      color: var(--on-red);
    }

    .spot b {
      font-family: var(--font-display);
      font-weight: 700;
      display: block;
      letter-spacing: .06em;
    }

    .spot span.s {
      font-size: 13px;
      color: var(--muted);
    }

    .chip {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      background: var(--raised);
      color: var(--muted);
    }

    .chip.ok {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .chip.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .chip.red {
      background: var(--red-soft);
      color: var(--red-text);
    }

    .sim {
      border: 1px dashed var(--line);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sim .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sim button {
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
      padding: 8px 12px;
      min-height: 44px;
      font-weight: 700;
    }

    /* クイズ：スポットライトの紙面 */
    .paper {
      background: var(--paper);
      color: var(--paper-ink);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .paper .small {
      color: var(--paper-sub);
    }

    .qno {
      font-family: var(--font-num);
      font-weight: 600;
      letter-spacing: .25em;
      font-size: 15px;
      color: var(--red);
    }

    .q {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.8;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice {
      text-align: left;
      border: 1.5px solid var(--paper-line);
      background: #f3f3f3;
      color: var(--paper-ink);
      padding: 14px;
      min-height: 54px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 500;
    }

    .choice .k {
      width: 28px;
      height: 28px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--paper-ink);
      color: #fff;
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 16px;
    }

    .choice[aria-pressed="true"] {
      background: var(--red);
      color: var(--on-red);
      border-color: var(--red);
    }

    .choice[aria-pressed="true"] .k {
      background: #fff;
      color: var(--red);
    }

    .imgph {
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      border: 1.5px dashed var(--paper-line);
      display: grid;
      place-items: center;
      color: var(--paper-sub);
      font-size: 13px;
      text-align: center;
      padding: 8px;
    }

    .imgph svg {
      width: 38%;
      height: auto;
      max-height: 100%;
    }

    .imggrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .imggrid .choice {
      flex-direction: column;
      align-items: stretch;
      padding: 10px;
    }

    .imggrid .imgph {
      aspect-ratio: 4 / 3;
      border-color: currentColor;
      color: inherit;
      opacity: .85;
    }

    .imggrid .lab {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .result {
      text-align: center;
      align-items: center;
    }

    .big-stamp {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: var(--red);
      color: var(--on-red);
      display: grid;
      place-items: center;
      transform: rotate(-9deg);
      box-shadow: inset 0 0 0 6px var(--surface), inset 0 0 0 8px var(--red-text);
      animation: press .45s ease-out;
    }

    .big-stamp b {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 56px;
      line-height: 1;
      display: block;
    }

    .big-stamp span {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .3em;
    }

    @keyframes press {
      from {
        transform: rotate(-9deg) scale(1.6);
        opacity: 0;
      }

      to {
        transform: rotate(-9deg) scale(1);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .big-stamp {
        animation: none;
      }

      .bar i {
        transition: none;
      }
    }

    .verdict {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 28px;
      letter-spacing: .2em;
    }

    .verdict.ok {
      color: var(--ok);
    }

    .verdict.ng {
      color: var(--warn);
    }

    .expl {
      background: var(--raised);
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      width: 100%;
    }

    .expl h3 {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12px;
      color: var(--red-text);
      letter-spacing: .2em;
      margin-bottom: 4px;
    }

    .draft {
      font-size: 12px;
      color: var(--warn);
    }

    .notice {
      border-left: 3px solid var(--red);
      background: var(--red-soft);
      padding: 10px 12px;
      font-size: 14px;
    }

    .codebox {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 34px;
      letter-spacing: .2em;
      text-align: center;
      background: var(--raised);
      padding: 6px;
    }

    .copy {
      align-self: center;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 8px 14px;
      min-height: 44px;
      font-weight: 700;
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input[type=search],
    input[type=password],
    input[type=email],
    input[type=text] {
      font: inherit;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
      min-height: 48px;
      width: 100%;
    }

    .err {
      color: var(--red-text);
      font-size: 13px;
      min-height: 1.5em;
    }

    input[readonly] {
      color: var(--muted);
    }

    .agree {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 14px;
      cursor: pointer;
    }

    .agree input {
      width: 24px;
      height: 24px;
      flex: none;
      accent-color: var(--red);
      margin: 2px 0 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px 14px;
    }

    .stat b {
      display: block;
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 38px;
      line-height: 1.1;
    }

    .stat span {
      font-size: 12px;
      color: var(--muted);
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tools input[type=search] {
      flex: 1 1 200px;
      width: auto;
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
    }

    .seg button {
      border: 0;
      background: var(--surface);
      color: var(--muted);
      padding: 8px 12px;
      min-height: 44px;
      font-weight: 700;
    }

    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    .tablebox {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 640px;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      background: var(--raised);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.id,
    td.num {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }

    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px dashed var(--muted);
      vertical-align: middle;
    }

    .dot.on {
      border: 0;
      background: var(--red);
    }

    .xbtn {
      border: 0;
      padding: 8px 12px;
      min-height: 40px;
      font-weight: 700;
      background: var(--ink);
      color: var(--bg);
    }

    .xbtn.confirm {
      background: var(--red);
      color: var(--on-red);
    }

    .xbtn:disabled {
      background: transparent;
      color: var(--muted);
      cursor: default;
    }

    .you {
      background: var(--red-soft);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
    }

    .login {
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
    }
  </style>

  <div class="wrap" id="chrome">
    <div class="switch" role="group" aria-label="画面の切り替え（試作用）">
      <button id="tab-p" aria-pressed="true" type="button">参加者の画面</button>
      <button id="tab-a" aria-pressed="false" type="button">運営の画面</button>
    </div>
    <p class="proto">これは試作です。保存はこのページ内だけで、サーバーにはつながっていません。</p>
  </div>

  <div class="wrap" id="app" style="margin-top:16px"></div>

  <script>

    /* ---- クイズ（本番では正解と解説はサーバー側だけに置く） ---- */
    const BUST = [
      '<svg viewBox="0 0 80 70" aria-hidden="true"><circle cx="40" cy="22" r="13" fill="currentColor"/><path d="M12 68c0-16 12-26 28-26s28 10 28 26z" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 80 70" aria-hidden="true"><rect x="28" y="8" width="24" height="28" rx="4" fill="currentColor"/><path d="M12 68c0-16 12-26 28-26s28 10 28 26z" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 80 70" aria-hidden="true"><ellipse cx="40" cy="22" rx="10" ry="15" fill="currentColor"/><path d="M16 68c0-16 10-26 24-26s24 10 24 26z" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 80 70" aria-hidden="true"><path d="M40 6l15 28H25z" fill="currentColor"/><path d="M10 68c0-16 12-26 30-26s30 10 30 26z" fill="currentColor"/></svg>'
    ];
    const SPOTS = [
      {
        id: 1, type: "single", q: "20世紀初頭、ピカソやジョルジュ・ブラックが描いた作品に見られる、複数の角度からの視点を合わせて描く手法を何というか。",
        c: ["未来派", "シュルレアリスム", "キュービズム", "フォーヴィスム"], a: [2],
        ex: "正解はキュービズム（立体派）です。対象を複数の視点から分解し、ひとつの画面に組み直す手法で、ピカソとブラックが始めました。\n未来派は動きや速度、シュルレアリスムは夢や無意識、フォーヴィスムは強い色彩が特徴です。", draft: true
      },
      {
        id: 2, type: "multi", q: "造形の前にある銅像はどれでしょう。当てはまるものをすべて選んでください。",
        c: ["A", "B", "C", "D"], a: [0], image: true,
        ex: "正解はAです。\n（問題の画像、正解、解説は仮です。あとで差し替えます）", draft: true
      },
      {
        id: 3, type: "all", q: "徹夜の連続、終わらない課題制作、度重なるダメ出しを乗り越えるために、美大生に最も不可欠な人間離れした要素とは？",
        c: ["勇気", "元気", "やる気", "狂気"], a: [0, 1, 2, 3],
        ex: "どれを選んでも正解です。\n最後にものを言うのは、やっぱり少しの狂気かもしれません。", draft: true
      },
      {
        id: 4, type: "single", q: "東京造形大学生が無料で行けない場所はどこ？",
        c: ["国立工芸館", "国立国際美術館", "国立映画アーカイブ", "国立劇場"], a: [3],
        ex: "正解は国立劇場です。\n国立工芸館、国立国際美術館、国立映画アーカイブは国立美術館の施設で、東京造形大学生は無料で入れます。", draft: true
      },
      {

    /* ---- 描画とイベント ---- */

    }
    document.addEventListener("click", e => {
      const t = e.target.closest("button"); if (!t) return;

      if (a === "top") return go("top");
      if (a === "complete") return go("complete");
      if (a === "apply") return st.email ? go("done") : go("apply", { err: "" });
      if (a === "submitapply") { if (!st.email) { st.email = st.mail1.trim(); st.sid = st.stu.trim(); save(); } return go("done"); }

        const m = document.getElementById("copymsg");

        catch (err) { m.textContent = "コピーできませんでした。番号を長押しして選んでください。"; }
        return;
      }
      if (a === "arrive") {
        const id = +t.dataset.id;
        return st.stamps[id] ? go("result", { spot: id }) : go("quiz", { spot: id, pick: [] });   // 回答済みなら結果を再表示（再回答は不可）
      }
      if (a === "pick") {
        const i = +t.dataset.i, s = SPOTS.find(x => x.id === st.spot);
        if (s.type === "multi") st.pick = st.pick.includes(i) ? st.pick.filter(x => x !== i) : [...st.pick, i];
        else st.pick = [i];
        return render();
      }
      if (a === "answer") {
        const s = SPOTS.find(x => x.id === st.spot);

      if (a === "xchg") {
        const id = t.dataset.id; const now = new Date(); const hm = now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
        if (id.startsWith("P-0000")) { if (st.prize !== "done") { st.prize = "done"; save(); } }
        else { const r = others.find(x => x.id === id); if (r && r.prize !== "done") { r.prize = "done"; r.at = hm; } }
        st.confirmId = null; return render();
      }
      if (a === "csv") {
        document.getElementById("csvbox").innerHTML = `<div class="card"><h2 style="font-size:15px">CSV（表示中の絞り込み結果）</h2><textarea id="csvta" readonly aria-label="CSV"></textarea><button class="xbtn" type="button" data-act="copycsv" style="align-self:flex-start">コピーする</button><p class="small" id="csvmsg"></p></div>`;
        document.getElementById("csvta").value = csvText(); return;
      }
      if (a === "copycsv") {
        const ta = document.getElementById("csvta"), m = document.getElementById("csvmsg");
        const fb = () => { ta.select(); m.textContent = "選択しました。コピーしてください。"; };
        try { navigator.clipboard.writeText(ta.value).then(() => m.textContent = "コピーしました。", fb); } catch (err) { fb(); }
      }
    });
    render();
  </script>

</body>

</html>
