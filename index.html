<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="学生自治会">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>挑戦状</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
  <style>
    /* Layout: ポスターと同じ、黒い地に赤い明朝の大見出し。クイズとアンケートだけは「スポットライトが当たった」明るい灰色の紙面にして、黒との対比をつくる。1カラムのスマホ縦画面が基準。参加者向けのサイトで、運営画面は別サイトに分けた。 */
    :root {
      --bg: #0a0a0b;
      --surface: #131315;
      --raised: #1d1d20;
      --ink: #f2f0ee;
      --muted: #a3a0a2;
      --line: #333236;
      --red: #c1272d;
      --red-text: #ee5256;
      --red-soft: #351214;
      --on-red: #ffffff;
      --paper: #e3e3e3;
      --paper-ink: #111111;
      --paper-sub: #4d4d4d;
      --paper-line: #b5b5b5;
      --ok: #6fd392;
      --ok-soft: #123226;
      --warn: #f0b95a;
      --warn-soft: #3a2d12;
      --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
      --font-num: "Cormorant Garamond", "Shippori Mincho B1", serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.3px);
      background-size: 6px 6px;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.8;
      padding-block: 12px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      font-weight: 800;
      margin: 0;
      line-height: 1.4;
      letter-spacing: .06em;
      text-wrap: balance;
    }

    p {
      margin: 0;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--red-text);
      outline-offset: 2px;
    }

    .proto {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .proto-btn {
      display: block;
      margin: 6px auto 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--muted);
      border-radius: 4px;
      font-size: 12px;
      padding: 6px 12px;
      font-family: inherit;
      cursor: pointer;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      border: 1px solid var(--line);
    }

    .band {
      background: var(--red);
      color: var(--on-red);
      padding: 26px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 0 0 50% 50% / 0 0 22px 22px;
      text-align: center;
    }

    .band .tag {
      font-family: var(--font-num);
      font-size: 14px;
      letter-spacing: .3em;
      opacity: .9;
    }

    .band h1 {
      font-size: 34px;
      line-height: 1.3;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      font-size: 18px;
    }

    .info {
      display: grid;
      grid-template-columns: 5.5em 1fr;
      gap: 10px 10px;
      font-size: 14px;
      margin: 0;
    }

    .info dt {
      color: var(--red-text);
      font-family: var(--font-display);
      font-weight: 700;
    }

    .info dd {
      margin: 0;
      min-width: 0;
    }

    .btn {
      display: block;
      border: 0;
      background: var(--red);
      color: var(--on-red);
      font-family: var(--font-display);
      font-weight: 800;
      padding: 14px 18px;
      min-height: 54px;
      font-size: 17px;
      width: 100%;
      letter-spacing: .12em;
      text-align: center;
      text-decoration: none;
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 700;
      letter-spacing: .06em;
    }

    .btn:disabled {
      background: var(--raised);
      color: var(--muted);
      cursor: not-allowed;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
    }

    .footer {
      text-align: center;
      font-family: var(--font-display);
      letter-spacing: .3em;
      color: var(--muted);
      font-size: 13px;
    }

    .progress {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .progress .n {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 60px;
      line-height: 1;
    }

    .progress .n small {
      font-size: 26px;
      color: var(--muted);
    }

    .bar {
      height: 6px;
      background: var(--raised);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--red);
      transition: width .4s;
    }

    .stamps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .slot {
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      border: 1px dashed var(--muted);
      color: var(--muted);
    }

    .slot.got {
      border: 0;
      color: var(--on-red);
      background: var(--red);
      transform: rotate(-8deg);
      box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4.5px var(--red-text);
    }

    .slot.got:nth-child(even) {
      transform: rotate(7deg);
    }

    .qno {
      font-family: var(--font-num);
      font-weight: 600;
      letter-spacing: .25em;
      font-size: 15px;
      color: var(--red);
    }

    .qno.dark {
      color: var(--red-text);
    }

    .spot {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 14px 10px 10px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .spot .no {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      border: 1px dashed var(--muted);
      color: var(--muted);
    }

    .spot.done .no {
      border: 0;
      background: var(--red);
      color: var(--on-red);
    }

    .spot.now {
      border-color: var(--red-text);
    }

    .spot.now .no {
      border: 2px solid var(--red-text);
      color: var(--red-text);
    }

    .spot b {
      font-family: var(--font-display);
      font-weight: 700;
      display: block;
      letter-spacing: .06em;
    }

    .spot span.s {
      font-size: 13px;
      color: var(--muted);
    }

    .chip {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      background: var(--raised);
      color: var(--muted);
    }

    .chip.ok {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .chip.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .chip.red {
      background: var(--red-soft);
      color: var(--red-text);
    }

    .sim {
      border: 1px dashed var(--line);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sim .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sim button {
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
      padding: 8px 12px;
      min-height: 44px;
      font-weight: 700;
    }

    /* クイズとアンケート：スポットライトの紙面 */
    .paper {
      background: var(--paper);
      color: var(--paper-ink);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .paper .small {
      color: var(--paper-sub);
    }

    .q {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.8;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice {
      text-align: left;
      border: 1.5px solid var(--paper-line);
      background: #f3f3f3;
      color: var(--paper-ink);
      padding: 14px;
      min-height: 54px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 500;
    }

    .choice .k {
      width: 28px;
      height: 28px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--paper-ink);
      color: #fff;
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 16px;
    }

    .choice[aria-pressed="true"] {
      background: var(--red);
      color: var(--on-red);
      border-color: var(--red);
    }

    .choice[aria-pressed="true"] .k {
      background: #fff;
      color: var(--red);
    }

    .imgph {
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      border: 1.5px dashed var(--paper-line);
      display: grid;
      place-items: center;
      color: var(--paper-sub);
      font-size: 13px;
      text-align: center;
      padding: 8px;
    }

    .imgph svg {
      width: 38%;
      height: auto;
      max-height: 100%;
    }

    .imggrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .imggrid .choice {
      flex-direction: column;
      align-items: stretch;
      padding: 10px;
    }

    .imggrid .imgph {
      aspect-ratio: 4 / 3;
      border-color: currentColor;
      color: inherit;
      opacity: .85;
    }

    .imggrid .lab {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .result {
      text-align: center;
      align-items: center;
    }

    .big-stamp {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: var(--red);
      color: var(--on-red);
      display: grid;
      place-items: center;
      transform: rotate(-9deg);
      box-shadow: inset 0 0 0 6px var(--surface), inset 0 0 0 8px var(--red-text);
      animation: press .45s ease-out;
    }

    .big-stamp b {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 56px;
      line-height: 1;
      display: block;
    }

    .big-stamp span {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .3em;
    }

    @keyframes press {
      from {
        transform: rotate(-9deg) scale(1.6);
        opacity: 0;
      }

      to {
        transform: rotate(-9deg) scale(1);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .big-stamp {
        animation: none;
      }

      .bar i {
        transition: none;
      }
    }

    .verdict {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 28px;
      letter-spacing: .2em;
    }

    .verdict.ok {
      color: var(--ok);
    }

    .verdict.ng {
      color: var(--warn);
    }

    .expl {
      background: var(--raised);
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      width: 100%;
    }

    .expl.hint {
      border-left: 3px solid var(--red);
    }

    .expl h3 {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12px;
      color: var(--red-text);
      letter-spacing: .2em;
      margin-bottom: 4px;
    }

    .draft {
      font-size: 12px;
      color: var(--warn);
    }

    .notice {
      border-left: 3px solid var(--red);
      background: var(--red-soft);
      padding: 10px 12px;
      font-size: 14px;
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input[type=text] {
      font: inherit;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
      min-height: 48px;
      width: 100%;
    }

    input.sid {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: .2em;
    }

    .err {
      color: var(--red-text);
      font-size: 13px;
      min-height: 1.5em;
    }

    .agree {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 14px;
      cursor: pointer;
    }

    .agree input {
      width: 24px;
      height: 24px;
      flex: none;
      accent-color: var(--red);
      margin: 2px 0 0;
    }

    /* 運営ページ（同じページの中の別の画面） */
    .wrap.wide {
      max-width: 1040px;
    }

    .head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 16px;
      border-bottom: 2px solid var(--red);
      padding-bottom: 8px;
    }

    .head h1 {
      font-size: 22px;
    }

    .head span {
      font-family: var(--font-num);
      letter-spacing: .25em;
      font-size: 14px;
      color: var(--red-text);
    }

    input[type=search],
    input[type=password] {
      font: inherit;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
      min-height: 48px;
      width: 100%;
    }

    .login {
      max-width: 380px;
      margin: 0 auto;
      width: 100%;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px 14px;
    }

    .stat b {
      display: block;
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 38px;
      line-height: 1.1;
    }

    .stat span {
      font-size: 12px;
      color: var(--muted);
    }

    .svrow {
      display: grid;
      grid-template-columns: 9em 1fr 2.5em;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .svrow b {
      text-align: right;
      font-family: var(--font-num);
      font-size: 17px;
    }

    .svgroup {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 4px;
    }

    .members {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-left: 0;
      margin: 0;
      list-style: none;
    }

    .who {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 15px;
      padding: 1px 10px;
      background: var(--raised);
      border: 1px solid var(--line);
    }

    .who small {
      font-family: var(--font-body);
      font-weight: 400;
      color: var(--muted);
      font-size: 12px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tools input[type=search] {
      flex: 1 1 220px;
      width: auto;
    }

    .seg {
      display: flex;
      flex-wrap: wrap;
      border: 1px solid var(--line);
    }

    .seg button {
      border: 0;
      background: var(--surface);
      color: var(--muted);
      padding: 8px 12px;
      min-height: 44px;
      font-weight: 700;
    }

    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    .tablebox {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      background: var(--raised);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.id,
    td.num {
      font-family: var(--font-num);
      font-weight: 600;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }

    tr.me td {
      background: var(--red-soft);
    }

    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px dashed var(--muted);
      vertical-align: middle;
    }

    .dot.on {
      border: 0;
      background: var(--red);
    }

    .xbtn {
      border: 0;
      padding: 8px 12px;
      min-height: 40px;
      font-weight: 700;
      background: var(--ink);
      color: var(--bg);
    }

    .xbtn.confirm {
      background: var(--red);
      color: var(--on-red);
    }

    .xbtn:disabled {
      background: transparent;
      color: var(--muted);
      cursor: default;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--ink);
    }
  </style>

  <div class="wrap" id="chrome">
    <p class="proto">これは試作です。保存はこの端末のブラウザの中だけで、サーバーにはつながっていません。</p>
    <button id="reset" class="proto-btn" type="button">最初からやり直す（試作用）</button>
    <button class="proto-btn" type="button" data-act="adopen">運営の画面を開く（試作用）</button>
  </div>

  <div class="wrap" id="app" style="margin-top:16px"></div>

  <script>
    /* ---- アンケート（選択肢は仮） ---- */
    const SURVEY = { q: "もしもA賞が当たったら何が欲しいですか？", c: ["お米（仮）", "お米（仮）", "お米（仮）", "お米（仮）"] };

    /* ---- 各謎の場所。HINTS[0]は謎1の場所（スタート地点の10号館食堂で、ヒントは不要） ---- */
    const HINTS = [
      "10号館食堂です。",
      "丸い建物のすぐ近く",
      "デザイン棟の階段",
      "バス停から近い円柱",
      "一番最初QRコードがあった建物の地下　営業中！"
    ];

    /* ---- クイズ（本番では正解と解説はサーバー側だけに置く） ---- */
    const BUST = [
      '<svg viewBox="0 0 80 70" aria-hidden="true"><circle cx="40" cy="22" r="13" fill="currentColor"/><path d="M12 68c0-16 12-26 28-26s28 10 28 26z" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 80 70" aria-hidden="true"><rect x="28" y="8" width="24" height="28" rx="4" fill="currentColor"/><path d="M12 68c0-16 12-26 28-26s28 10 28 26z" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 80 70" aria-hidden="true"><ellipse cx="40" cy="22" rx="10" ry="15" fill="currentColor"/><path d="M16 68c0-16 10-26 24-26s24 10 24 26z" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 80 70" aria-hidden="true"><path d="M40 6l15 28H25z" fill="currentColor"/><path d="M10 68c0-16 12-26 30-26s30 10 30 26z" fill="currentColor"/></svg>'
    ];
    const SPOTS = [
      {

  </section>
  <button class="btn ghost" type="button" data-act="adexit">参加者の画面にもどる</button>
  <p class="proto">試作です。本番では、サーバー側で合言葉を確かめます。</p>`;
    }
    function adDashView() {
      const all = adRows();
      const total = all.length, applied = all.filter(p => p.sid).length, elig = all.filter(p => p.elig).length, comp = all.filter(p => p.total === AD_N).length, done = all.filter(p => p.total === AD_N && p.prize === "done").length;
      const list = adFiltered();
      return `
  <div class="head"><h1>運営ダッシュボード</h1><button class="xbtn" type="button" data-act="adexit">参加者の画面へ</button></div>
  <p class="notice">赤い「この端末（あなた）」の行は、いまこの端末で操作した記録です。ほかの行はサンプルです。ほかの人のスマホの操作は、ここには出ません。本番では、全員の記録が、同じデータベースから自動で並びます。</p>
  <div class="stats">
    <div class="stat"><b>${total}</b><span>参加者</span></div>
    <div class="stat"><b>${applied}</b><span>学籍番号を入力（応募）</span></div>
    <div class="stat"><b>${elig}</b><span>抽選の対象（応募＋1問以上）</span></div>
    <div class="stat"><b>${comp}</b><span>5つ達成（参加賞の対象）</span></div>
    <div class="stat"><b>${done}</b><span>参加賞 渡し済み</span></div>
    <div class="stat"><b>${comp - done}</b><span>参加賞 未交換</span></div>
  </div>

  <section class="card">
    <h2>アンケート：${esc(SURVEY.q)}</h2>
    ${SURVEY.c.map((c, i) => {
        const m = all.filter(p => p.sv === i), pct = total ? Math.round(m.length / total * 100) : 0;
        return `<div class="svgroup">
        <div class="svrow"><span>${i + 1}. ${esc(c)}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${m.length}</b></div>
        ${m.length ? `<ul class="members">${m.map(p => `<li class="who">${esc(p.name || p.id)}${p.sid ? ` <small>／</small> ${esc(p.sid)}` : ` <small>（学籍番号なし）</small>`}</li>`).join("")}</ul>` : `<p class="small">選んだ人はいません</p>`}
      </div>`;
      }).join("")}
    <p class="small">参加者番号は、サイトが自動でつける番号です。学籍番号は、抽選に応募した人だけ表示されます。</p>
  </section>

  <div class="tools">
    <input type="search" id="adq" placeholder="参加者番号・学籍番号で探す" value="${esc(adSt.q)}" aria-label="参加者番号・学籍番号で探す">
    <div class="seg" role="group" aria-label="絞り込み">
      <button type="button" data-f="all" aria-pressed="${adSt.filter === "all"}">全員</button>
      <button type="button" data-f="app" aria-pressed="${adSt.filter === "app"}">応募済み</button>
      <button type="button" data-f="elig" aria-pressed="${adSt.filter === "elig"}">抽選の対象</button>
      <button type="button" data-f="done" aria-pressed="${adSt.filter === "done"}">5つ達成</button>
      <button type="button" data-f="unex" aria-pressed="${adSt.filter === "unex"}">参加賞 未交換</button>
    </div>
    <button class="xbtn" type="button" data-act="ad_csv">CSVを表示</button>
  </div>
  <div class="tablebox"><table>
    <thead><tr><th>参加者番号</th>${Array.from({ length: AD_N }, (_, i) => `<th>謎${i + 1}</th>`).join("")}<th>合計</th><th>応募</th><th>学籍番号</th><th>アンケート</th><th>参加賞</th><th></th></tr></thead>
    <tbody>${list.length ? list.map(p => {
        const comp = p.total === AD_N, ex = p.prize === "done";
        return `<tr class="${p.me ? "me" : ""}">
        <td class="id">${esc(p.name || p.id)}</td>
        ${p.s.map(v => `<td><span class="dot ${v ? "on" : ""}" aria-label="${v ? "獲得" : "未獲得"}"></span></td>`).join("")}
        <td class="num">${p.total}/${AD_N}</td>
        <td>${p.sid ? (p.total >= 1 ? '<span class="chip ok">応募済み</span>' : '<span class="chip warn">応募済み・回答なし</span>') : (p.total >= 1 ? '<span class="chip warn">未応募</span>' : '<span class="chip">—</span>')}</td>
        <td class="id">${p.sid ? esc(p.sid) : '<span class="small">—</span>'}</td>
        <td>${typeof p.sv === "number" ? `<span class="chip red">${p.sv + 1}</span>` : '<span class="small">—</span>'}</td>
        <td>${!comp ? '<span class="chip">対象外</span>' : ex ? `<span class="chip ok">渡し済み${p.at ? " " + p.at : ""}</span>` : '<span class="chip warn">未交換</span>'}</td>
        <td>${comp ? (ex ? `<button class="xbtn" disabled>渡し済み</button>` : (adSt.confirmId === p.id ? `<button class="xbtn confirm" data-act="ad_xchg" data-id="${esc(p.id)}">本当に渡した</button>` : `<button class="xbtn" data-act="ad_xask" data-id="${esc(p.id)}">交換済みにする</button>`)) : ""}</td>
      </tr>`;
      }).join("") : `<tr><td colspan="12" class="small">該当する参加者がいません</td></tr>`}</tbody>
  </table></div>
  <p class="small">「アンケート」の列の数字は、選んだ選択肢の番号です。5つ達成した人には、参加賞を必ず渡します。渡したときに「交換済みにする」を押してください。確認を挟んで1人につき1回だけ押せて、渡し済みの人には再度押せないため、二重配布を防げます。抽選の対象は、学籍番号を入力していて、1つ以上スタンプがある人です。</p>
  ${adSt.csv ? `<div class="card"><h2>CSV（表示中の絞り込み結果）</h2><textarea id="adcsvta" readonly aria-label="CSV">${esc(adCsv())}</textarea><button class="xbtn" type="button" data-act="ad_copycsv" style="align-self:flex-start">コピーする</button><p class="small" id="adcsvmsg" role="status"></p></div>` : ""}`;
    }
    function adminView() { return adSt.loggedIn ? adDashView() : adLoginView(); }
    function adBind() {
      const lf = document.getElementById("adlogin");
      if (lf) lf.addEventListener("submit", async e => {
        e.preventDefault();
        const v = document.getElementById("adpw").value.trim().normalize("NFKC").toLowerCase();
        try {
          if ((await adSha(v)) === AD_HASH) { adSt.loggedIn = true; adSt.err = ""; }
          else adSt.err = "合言葉が違います。";
        } catch (err) { adSt.err = "この画面では、合言葉を確かめられませんでした。"; }
        render();
      });
      const q = document.getElementById("adq");
      if (q) q.addEventListener("input", e => { adSt.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("adq"); n.focus(); n.setSelectionRange(pos, pos); });
    }
    function adAct(a, t) {
      if (a === "ad_xask") { adSt.confirmId = t.dataset.id; return render(); }
      if (a === "ad_xchg") {
        const d = new Date(), at = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"), id = t.dataset.id;
        if (id === "this-device") { if (st.prize !== "done") { st.prize = "done"; st.prizeAt = at; save(); } }
        else { const p = adPeople.find(x => x.id === id); if (p && p.prize !== "done") { p.prize = "done"; p.at = at; } }
        adSt.confirmId = null; return render();
      }
      if (a === "ad_csv") { adSt.csv = !adSt.csv; return render(); }
      if (a === "ad_copycsv") {
        const ta = document.getElementById("adcsvta"), m = document.getElementById("adcsvmsg");
        const fb = () => { ta.select(); m.textContent = "選択しました。コピーしてください。"; };
        try { navigator.clipboard.writeText(ta.value).then(() => m.textContent = "コピーしました。", fb); } catch (err) { fb(); }
      }
    }

    let pending = null;
    function openSpot(id) {
      const n = count();
      if (id <= n) return go("result", { spot: id });            // 回答済み：結果を再表示（再回答は不可）
      if (id === n + 1) return go("quiz", { spot: id, pick: [] });  // つぎの謎：クイズを開く
      return go("locked", { spot: id });                         // 順番が先の謎：まだ開けない
    }
    function openPending() { const id = pending; pending = null; return openSpot(id); }
    function readHash() {
      if (location.hash === "#admin") return go("admin");
      const m = /^#q([1-5])$/.exec(location.hash); if (!m) return;
      pending = +m[1];
      if (st.sid && st.sv !== null) openPending();   // 入力・アンケートがまだなら、そのあとで開く
    }
    window.addEventListener("hashchange", readHash);
    document.addEventListener("click", e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.id === "reset") { try { localStorage.removeItem(LS); } catch (err) { } st = { stamps: {}, screen: "apply", spot: null, pick: [], sid: "", stu: "", agree: false, err: "", from: "rally", sv: null, svpick: null }; return go("apply"); }
      if (t.dataset.f) { adSt.filter = t.dataset.f; return render(); }
      const a = t.dataset.act; if (!a) return;
      if (a === "adopen") return go("admin");
      if (a === "adexit") return go(defaultScreen());
      if (a.startsWith("ad_")) return adAct(a, t);
      if (a === "svpick") { st.svpick = +t.dataset.i; return render(); }
      if (a === "svsubmit") { if (st.svpick === null) return; st.sv = st.svpick; save(); return pending ? openPending() : go("top"); }
      if (a === "start" || a === "rally") return go("rally");
      if (a === "top") return go("top");
      if (a === "complete") return go("complete");
      if (a === "backquiz") return go("quiz");                     // 最初のQRの画面にもどる（選んだ答えは残る）
      if (a === "apply") {                                         // 最初のQRを読み取った時点から入力できる
        const from = t.dataset.from || st.from || "rally";
        return st.sid ? go("done", { from }) : go("apply", { err: "", from });
      }
      if (a === "submitapply") { if (!st.sid) { st.sid = st.stu; save(); } return st.sv === null ? go("survey") : pending ? openPending() : go("top"); }   // 同じ学籍番号の応募は1回だけ
      if (a === "arrive") {
        return openSpot(+t.dataset.id);
      }
      if (a === "pick") {
        const i = +t.dataset.i, s = SPOTS.find(x => x.id === st.spot);
        if (s.type === "multi") st.pick = st.pick.includes(i) ? st.pick.filter(x => x !== i) : [...st.pick, i];
        else st.pick = [i];
        return render();
      }
      if (a === "answer") {
        const s = SPOTS.find(x => x.id === st.spot);
        if (!st.stamps[s.id]) {   // 同じ謎は1回だけ登録
          let ok;
          if (s.type === "all") ok = true;
          else if (s.type === "multi") ok = st.pick.length === s.a.length && s.a.every(x => st.pick.includes(x));
          else ok = st.pick[0] === s.a[0];
          st.stamps[s.id] = { ok };
        }
        save(); return go("result");
      }
    });
    render();
    readHash();
  </script>

</body>

</html>
