    <button class="xbtn" type="button" data-act="ad_csv">CSVを表示</button>
  </div>
  ${adSt.err ? `<p class="notice" role="alert">${esc(adSt.err)}</p>` : ""}
  <div class="tablebox"><table>
    <thead><tr><th>参加者番号</th>${Array.from({ length: AD_N }, (_, i) => `<th>謎${i + 1}</th>`).join("")}<th>合計</th><th>応募</th><th>学籍番号</th><th>アンケート</th><th>参加賞</th><th></th></tr></thead>
    <tbody>${list.length ? list.map(p => {
        const comp = p.total === AD_N, ex = p.prize === "done";
        return `<tr>
        <td class="id">${esc(p.id)}</td>
        ${p.ok.map(v => `<td><span class="dot ${v !== null ? "on" : ""}" title="${v === null ? "未回答" : v ? "正解" : "不正解"}" aria-label="${v === null ? "未回答" : v ? "正解" : "不正解"}"></span></td>`).join("")}
        <td class="num">${p.total}/${AD_N}</td>
        <td>${p.total >= 1 ? '<span class="chip ok">抽選の対象</span>' : '<span class="chip warn">回答なし</span>'}</td>
        <td class="id">${p.sid ? esc(p.sid) : '<span class="small">—</span>'}</td>
        <td>${typeof p.sv === "number" ? `<span class="chip red">${p.sv + 1}</span>` : '<span class="small">—</span>'}</td>
        <td>${!comp ? '<span class="chip">対象外</span>' : ex ? `<span class="chip ok">渡し済み${p.at ? " " + esc(p.at) : ""}</span>` : '<span class="chip warn">未交換</span>'}</td>
        <td>${comp ? (ex ? `<button class="xbtn" disabled>渡し済み</button>` : (adSt.confirmId === p.id ? `<button class="xbtn confirm" data-act="ad_xchg" data-id="${esc(p.id)}">本当に渡した</button>` : `<button class="xbtn" data-act="ad_xask" data-id="${esc(p.id)}">交換済みにする</button>`)) : ""}</td>
      </tr>`;
      }).join("") : `<tr><td colspan="12" class="small">該当する参加者がいません</td></tr>`}</tbody>
  </table></div>
  <p class="small">謎の列の丸にカーソルを合わせると正解・不正解が出ます。5つ達成した人に参加賞を渡したら「交換済みにする」を押してください。サーバー側でも渡し済みかを確かめるので、別の端末から同時に押しても二重配布になりません。</p>
  ${adSt.csv ? `<div class="card"><h2>CSV（表示中の絞り込み結果）</h2><textarea id="adcsvta" readonly aria-label="CSV">${esc(adCsv())}</textarea><button class="xbtn" type="button" data-act="ad_copycsv" style="align-self:flex-start">コピーする</button><p class="small" id="adcsvmsg" role="status"></p></div>` : ""}`;
    }
    function adminView() { return adSt.loggedIn ? adDashView() : adLoginView(); }
    function adLoad(res) { adSt.rows = res.rows || []; adSt.updated = res.updated || ""; }
    function adBind() {
      const lf = document.getElementById("adlogin");
      if (lf) lf.addEventListener("submit", async e => {
        e.preventDefault();
        if (st.busy) return;
        const pw = document.getElementById("adpw").value;
        await busy(async () => {
          try { adLoad(await api("admin_list", { pw })); adSt.loggedIn = true; adSt.pw = pw; adSt.err = ""; }
          catch (err) { adSt.err = errMsg(err); }
        });
      });
      const q = document.getElementById("adq");
      if (q) q.addEventListener("input", e => { adSt.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("adq"); n.focus(); n.setSelectionRange(pos, pos); });
    }
    async function adAct(a, t) {
      if (a === "ad_xask") { adSt.confirmId = t.dataset.id; return render(); }
      if (a === "ad_xchg") {
        return busy(async () => {
          try { adLoad(await api("admin_exchange", { pw: adSt.pw, id: t.dataset.id })); adSt.err = ""; }
          catch (err) { adSt.err = errMsg(err); if (err.code === "bad_password") adSt.loggedIn = false; }
          adSt.confirmId = null;
        });
      }
      if (a === "ad_reload") {
        return busy(async () => {
          try { adLoad(await api("admin_list", { pw: adSt.pw })); adSt.err = ""; }
          catch (err) { adSt.err = errMsg(err); if (err.code === "bad_password") adSt.loggedIn = false; }
        });
      }
      if (a === "ad_csv") { adSt.csv = !adSt.csv; return render(); }
      if (a === "ad_copycsv") {
        const ta = document.getElementById("adcsvta"), m = document.getElementById("adcsvmsg");
        const fb = () => { ta.select(); m.textContent = "選択しました。コピーしてください。"; };
        try { navigator.clipboard.writeText(ta.value).then(() => m.textContent = "コピーしました。", fb); } catch (err) { fb(); }
      }
    }

    /* ---- 描画とイベント ---- */
    function render() {
      const views = { loading: loadingView, survey: surveyView, top: topView, rally: rallyView, locked: lockedView, quiz: quizView, result: resultView, complete: completeView, apply: applyView, confirm: confirmView, admin: adminView };
      app.innerHTML = (st.msg ? `<p class="notice" role="alert">${esc(st.msg)}</p>` : "") + views[st.screen]();
      app.className = "wrap" + (st.screen === "admin" && adSt.loggedIn ? " wide" : "");
      if (st.busy) app.querySelectorAll("button").forEach(b => b.disabled = true);
      if (st.screen === "admin") adBind();
      const af = document.getElementById("applyform");
      if (af) af.addEventListener("submit", e => {
        e.preventDefault();
        st.stu = document.getElementById("stu").value.trim().normalize("NFKC");
        st.agree = document.getElementById("agree").checked;
        if (!/^[0-9]{8}$/.test(st.stu)) st.err = "学籍番号は、数字8桁で入力してください。";
        else if (!st.agree) st.err = "学籍番号の使いみちへの同意にチェックを入れてください。";
        else { st.err = ""; return go("confirm"); }
        render();
      });
    }
    /* 通信中はボタンを押せなくする */
    async function busy(fn) { st.busy = true; render(); try { await fn(); } finally { st.busy = false; render(); } }

    function defaultScreen() { return !st.sid ? "apply" : st.sv === null ? "survey" : "top"; }

    /* QRコード読み取り：URL の末尾 #q1〜#q5 でその謎を直接開く（学籍番号・アンケートが先） */
    let pending = null;
    function openSpot(id) {
      const n = count();
      if (st.stamps[id]) return go("result", { spot: id });       // 回答済み：結果を再表示（再回答は不可）
      if (id === n + 1) return go("quiz", { spot: id, pick: [] });  // つぎの謎：クイズを開く
      return go("locked", { spot: id });                         // 順番が先の謎：まだ開けない
    }
    function afterReady() { if (pending) { const id = pending; pending = null; return openSpot(id); } go(defaultScreen()); }
    function readHash() {
      if (location.hash === "#admin") return go("admin");
      const m = /^#q([1-5])$/.exec(location.hash); if (!m) return;
      pending = +m[1];
      if (st.screen !== "loading" && st.sid && st.sv !== null) afterReady();
    }
    window.addEventListener("hashchange", readHash);

    /* 起動時：この端末に学籍番号があれば、サーバーから最新の記録を読み込む */
    async function boot() {
      if (location.hash === "#admin") return go("admin");
      const m = /^#q([1-5])$/.exec(location.hash); if (m) pending = +m[1];
      if (!st.sid) return go("apply");
      st.screen = "loading"; st.msg = ""; render();
      try { applyState(await api("state", { sid: st.sid })); afterReady(); }
      catch (err) {
        if (err.code === "not_found") { forget(); return go("apply"); }
        st.msg = errMsg(err); render();
      }
    }

    document.addEventListener("click", async e => {
      const t = e.target.closest("button"); if (!t || st.busy) return;
      if (t.dataset.f) { adSt.filter = t.dataset.f; return render(); }
      const a = t.dataset.act; if (!a) return;
      if (a === "retry") return boot();
      if (a === "adexit") { history.replaceState(null, "", location.pathname + location.search); return st.sid ? go(defaultScreen()) : boot(); }
      if (a.startsWith("ad_")) return adAct(a, t);
      if (a === "svpick") { st.svpick = +t.dataset.i; return render(); }
      if (a === "svsubmit") {
        if (st.svpick === null) return;
        return busy(async () => {
          try { applyState(await api("survey", { sid: st.sid, choice: st.svpick })); st.busy = false; afterReady(); }
          catch (err) { st.msg = errMsg(err); if (err.code === "not_found") { forget(); st.screen = "apply"; } }
        });
      }
      if (a === "start" || a === "rally") return go("rally");
      if (a === "top") return go("top");
      if (a === "complete") return go("complete");
      if (a === "apply") return go("apply", { err: "" });
      if (a === "submitapply") {
        return busy(async () => {
          try {
            const r = await api("register", { sid: st.stu });
            applyState(r); st.busy = false;
            if (r.existed) st.msg = "";   // 2台目以降：続きから
            afterReady();
          } catch (err) { st.msg = errMsg(err); }
        });
      }
      if (a === "arrive") return openSpot(+t.dataset.id);
      if (a === "pick") {
        const i = +t.dataset.i, s = SPOTS.find(x => x.id === st.spot);
        if (s.type === "multi") st.pick = st.pick.includes(i) ? st.pick.filter(x => x !== i) : [...st.pick, i];
        else st.pick = [i];
        return render();
      }
      if (a === "answer") {
        if (!st.pick.length) return;
        const spot = st.spot;
        return busy(async () => {
          try { applyState(await api("answer", { sid: st.sid, spot, pick: st.pick })); st.busy = false; go("result", { spot }); }
          catch (err) {
            if (err.code === "locked" && err.res) { applyState(err.res); st.busy = false; return go("locked", { spot }); }
            if (err.code === "not_found") { forget(); st.busy = false; return go("apply", { msg: ERR.not_found }); }
            st.msg = errMsg(err);
          }
        });
      }
    });
    boot();
  </script>

</body>

</html>
