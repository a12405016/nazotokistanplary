<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>キャンパス謎解きラリー</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
  <meta name="description" content="キャンパス謎解きラリーの試作です。5つのスポットを探してクイズに答え、スタンプを集めます。">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="キャンパス謎解きラリー">
  <meta noindex name="robots" content="noindex">
  <style>
    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --ink: #17233b;
      --muted: #5d6a82;
      --line: #d3d9e4;
      --accent: #2c55e0;
      --accent-ink: #ffffff;
      --stamp: #e0472b;
      --stamp-soft: #fde8e3;
      --ok: #17803d;
      --ok-soft: #dff3e6;
      --warn: #9a5b00;
      --warn-soft: #fbeccd;
      --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      --font-mono: "DM Mono", ui-monospace, "SF Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1626;
        --surface: #19223a;
        --ink: #e8edf8;
        --muted: #9aa8c4;
        --line: #2c3a58;
        --accent: #7d9bff;
        --accent-ink: #0f1626;
        --stamp: #ff7a5f;
        --stamp-soft: #3a2420;
        --ok: #6fd392;
        --ok-soft: #173325;
        --warn: #f0b95a;
        --warn-soft: #3a2d12;
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.7;
      padding-block: 12px 40px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .wrap.wide {
      max-width: 980px;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      margin: 0;
      line-height: 1.35;
      text-wrap: balance;
    }

    p {
      margin: 0;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .switch {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
    }

    .switch button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 9px;
      font-weight: 700;
      min-height: 40px;
    }

    .switch button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    .proto {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .hero {
      background: var(--ink);
      color: var(--bg);
      border-radius: 18px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .hero .tag {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .12em;
      color: var(--stamp);
    }

    .hero h1 {
      font-size: 30px;
      font-weight: 900;
      color: var(--bg);
    }

    .hero p {
      color: var(--bg);
      opacity: .85;
    }

    .hero .ring {
      position: absolute;
      right: -34px;
      top: -34px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px dashed var(--stamp);
      opacity: .55;
      transform: rotate(-12deg);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info {
      display: grid;
      grid-template-columns: 5.5em 1fr;
      gap: 6px 10px;
      font-size: 14px;
    }

    .info dt {
      color: var(--muted);
      font-weight: 700;
    }

    .info dd {
      margin: 0;
      min-width: 0;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      padding: 14px 18px;
      min-height: 52px;
      font-size: 16px;
      width: 100%;
    }

    .btn.ghost {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    .btn:disabled {
      background: var(--line);
      color: var(--muted);
      cursor: not-allowed;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
    }

    .progress {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .progress .n {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 44px;
      line-height: 1;
    }

    .progress .n small {
      font-size: 22px;
      color: var(--muted);
    }

    .bar {
      height: 10px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--stamp);
      border-radius: 999px;
      transition: width .4s;
    }

    .stamps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .slot {
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 18px;
      border: 2.5px dashed var(--line);
      color: var(--muted);
      background: transparent;
    }

    .slot.got {
      border: 3px solid var(--stamp);
      color: var(--stamp);
      background: var(--stamp-soft);
      transform: rotate(-8deg);
      box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4.5px var(--stamp);
    }

    .slot.got:nth-child(even) {
      transform: rotate(7deg);
    }

    .spot {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    .spot .no {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 900;
      border: 2.5px dashed var(--line);
      color: var(--muted);
    }

    .spot.done .no {
      border: 3px solid var(--stamp);
      color: var(--stamp);
      background: var(--stamp-soft);
    }

    .spot .t {
      min-width: 0;
    }

    .spot .t b {
      display: block;
      font-family: var(--font-display);
    }

    .spot .t span {
      font-size: 13px;
      color: var(--muted);
      display: block;
    }

    .chip {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      background: var(--line);
      color: var(--muted);
    }

    .chip.ok {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .chip.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .chip.stamp {
      background: var(--stamp-soft);
      color: var(--stamp);
    }

    .spot .go {
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 10px;
      font-weight: 700;
      padding: 8px 12px;
      min-height: 44px;
    }

    .q {
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-display);
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice {
      text-align: left;
      border: 2px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 12px;
      padding: 14px;
      min-height: 54px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .choice .k {
      width: 28px;
      height: 28px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--line);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .choice[aria-pressed="true"] {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    }

    .choice[aria-pressed="true"] .k {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .result {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .big-stamp {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 5px solid var(--stamp);
      color: var(--stamp);
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 900;
      transform: rotate(-9deg);
      background: var(--stamp-soft);
      box-shadow: inset 0 0 0 6px var(--surface), inset 0 0 0 8px var(--stamp);
      animation: press .45s ease-out;
    }

    .big-stamp b {
      font-size: 46px;
      line-height: 1;
      display: block;
    }

    .big-stamp span {
      font-size: 13px;
      letter-spacing: .1em;
    }

    @keyframes press {
      from {
        transform: rotate(-9deg) scale(1.6);
        opacity: 0;
      }

      to {
        transform: rotate(-9deg) scale(1);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .big-stamp {
        animation: none;
      }

      .bar i {
        transition: none;
      }
    }

    .verdict {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 22px;
    }

    .verdict.ok {
      color: var(--ok);
    }

    .verdict.ng {
      color: var(--warn);
    }

    .expl {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      width: 100%;
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input[type=email],
    input[type=search],
    input[type=text] {
      font: inherit;
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      min-height: 48px;
      width: 100%;
    }

    .err {
      color: var(--stamp);
      font-size: 13px;
      min-height: 1.4em;
    }

    .notice {
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
      padding: 10px 12px;
      border-radius: 0 10px 10px 0;
      font-size: 14px;
    }

    .codebox {
      font-family: var(--font-mono);
      font-size: 22px;
      letter-spacing: .18em;
      text-align: center;
      background: var(--bg);
      border-radius: 10px;
      padding: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .stat b {
      display: block;
      font-family: var(--font-display);
      font-size: 30px;
      line-height: 1.1;
      font-weight: 900;
    }

    .stat span {
      font-size: 12px;
      color: var(--muted);
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tools input[type=search] {
      flex: 1 1 200px;
      width: auto;
    }

    .seg {
      display: flex;
      border: 2px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .seg button {
      border: 0;
      background: var(--surface);
      color: var(--muted);
      padding: 8px 12px;
      min-height: 44px;
      font-weight: 700;
    }

    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    .tablebox {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 720px;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.id,
    td.num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px dashed var(--line);
      vertical-align: middle;
    }

    .dot.on {
      border: 0;
      background: var(--stamp);
    }

    .xbtn {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      min-height: 40px;
      font-weight: 700;
      background: var(--accent);
      color: var(--accent-ink);
    }

    .xbtn.confirm {
      background: var(--stamp);
      color: #fff;
    }

    .xbtn:disabled {
      background: transparent;
      color: var(--muted);
      cursor: default;
    }

    .you {
      background: color-mix(in srgb, var(--accent) 7%, var(--surface));
    }

    textarea {
      width: 100%;
      min-height: 140px;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
    }

    .login {
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
    }
  </style>
  <div class="wrap" id="chrome">
    <div class="switch" role="group" aria-label="画面の切り替え">
      <button id="tab-p" aria-pressed="true" type="button">参加者の画面</button>
      <button id="tab-a" aria-pressed="false" type="button">運営の画面</button>
    </div>
    <p class="proto">現在スプレッドシートと連携して本番モードで動作中です。</p>
  </div>
  <div class="wrap" id="app" style="margin-top:16px"></div>

  <script>
    // ★★★ここに手順5で取得する「Google Apps ScriptのWebアプリURL」を貼り付けてください★★★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwYOuOh3nqBJ5YM5smjo0JCsSojWqn93ml9neG7RSiuApLdyIKTdoh3t4sW1el_NjhCCw/exec";

    const SPOTS = [
      { id: 1, name: "スポット1", hint: "本を借りに行く建物の入口付近", q: "図書館の本の貸出期間は、一般的に何週間？", c: ["1週間", "2週間", "4週間"], a: 1, ex: "仮の解説：多くの大学図書館では2週間が標準です。" },
      { id: 2, name: "スポット2", hint: "お昼に人が集まる広い場所", q: "学食で一番人気のメニューはどれ？", c: ["カレー", "うどん", "唐揚げ定食"], a: 0, ex: "仮の解説：この問題と答えは仮です。" },
      { id: 3, name: "スポット3", hint: "大きな時計が見える広場", q: "大学の創立は何年？", c: ["1920年", "1949年", "1965年"], a: 1, ex: "仮の解説：実際の年は主催者の資料で差し替えます。" },
      { id: 4, name: "スポット4", hint: "運動する人たちが集まる場所", q: "体育館の中にないものはどれ？", c: ["バスケットゴール", "卓球台", "プール"], a: 2, ex: "仮の解説：この問題は仮です。" },
      { id: 5, name: "スポット5", hint: "学生の相談に乗ってくれる窓口の近く", q: "学生証をなくしたとき、最初にすることは？", c: ["そのままにする", "窓口に届け出る", "友達に借りる"], a: 1, ex: "仮の解説：実際の手順は大学の案内に合わせます。" }
    ];

    const LS = "rally-v2-prod";
    let st = { id: "", stamps: {}, email: "", screen: "top", spot: null, pick: null, mode: "p", prize: "none", filter: "all", q: "", loggedIn: false, confirmId: null };
    let others = [];

    // ローカルデータの読み込み
    try {
      const s = JSON.parse(localStorage.getItem(LS));
      if (s) {
        if (s.id) st.id = s.id;
        if (s.stamps) st.stamps = s.stamps;
        st.email = s.email || "";
        st.prize = s.prize || "none";
      }
    } catch (e) { }

    // 新規ユーザーにはランダムなIDを発行
    if (!st.id) {
      st.id = "P-" + Math.floor(Math.random() * 10000).toString().padStart(4, "0");
      saveLocal();
    }

    function saveLocal() {
      try { localStorage.setItem(LS, JSON.stringify({ id: st.id, stamps: st.stamps, email: st.email, prize: st.prize })); } catch (e) { }
    }

    // データの保存（ローカル保存＋サーバーへ送信）
    function save() {
      saveLocal();
      if (GAS_URL.startsWith("http")) {
        fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'update_user', id: st.id, stamps: st.stamps, email: st.email, prize: st.prize })
        }).catch(e => console.error("通信エラー", e));
      }
    }

    // サーバーからデータを一括取得（運営用）
    async function loadAdminData() {
      if (!GAS_URL.startsWith("http")) {
        alert("コード内の GAS_URL にサーバーのURLが設定されていません。");
        return;
      }
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        others = data.filter(x => x.id !== st.id); // 自分のデータを除外して一覧にセット
        render();
      } catch (e) {
        console.error("読込エラー", e);
        alert("データの取得に失敗しました。URLが正しいか確認してください。");
      }
    }

    const count = () => Object.keys(st.stamps).length;
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const app = document.getElementById("app");
    function go(screen, extra) { Object.assign(st, { screen }, extra || {}); render(); window.scrollTo(0, 0); }

    function stampRow() {
      return `<div class="stamps" aria-label="スタンプ ${count()}/5">` + SPOTS.map(s => `<div class="slot ${st.stamps[s.id] ? "got" : ""}">${st.stamps[s.id] ? "済" : s.id}</div>`).join("") + `</div>`;
    }
    function topView() {
      return `<section class="hero"><div class="ring"></div><span class="tag">STAMP RALLY</span><h1>キャンパス謎解きラリー</h1><p>キャンパスに隠れた5つのスポットを探して、クイズに答えてスタンプを集めよう。</p></section>
  <section class="card"><h2 style="font-size:17px">イベント概要</h2><dl class="info"><dt>参加者ID</dt><dd>${st.id}</dd><dt>開催場所</dt><dd>○○大学</dd><dt>遊び方</dt><dd>5つのスポットを自分で探し、クイズに答えるとスタンプがもらえます。</dd></dl></section>
  <button class="btn" data-act="start">${count() > 0 ? "ラリーをつづける" : "スタート"}</button>`;
    }
    function rallyView() {
      const n = count();
      return `<section class="card"><div class="progress"><div><span class="small">あつめたスタンプ</span><div class="n">${n}<small> / 5</small></div></div><span class="chip ${n === 5 ? "ok" : "stamp"}">${n === 5 ? "コンプリート" : "あと" + (5 - n) + "か所"}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${n}"><i style="width:${n * 20}%"></i></div>${stampRow()}</section>
  ${n === 5 ? `<button class="btn" data-act="complete">景品の抽選に進む</button>` : ""}
  <section style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:16px">スポットのヒント</h2>
    ${SPOTS.map(s => {
        const d = !!st.stamps[s.id]; return `<div class="spot ${d ? "done" : ""}"><div class="no">${d ? "済" : s.id}</div><div class="t"><b>${s.name}</b><span>${s.hint}</span></div>${d ? `<span class="chip ok">回答済み</span>` : `<button class="go" data-act="arrive" data-id="${s.id}" type="button">着いた</button>`}</div>`;
      }).join("")}</section>
  <button class="btn ghost" data-act="top" style="border-color:var(--line);color:var(--muted)">トップへ</button>`;
    }
    function quizView() {
      const s = SPOTS.find(x => x.id === st.spot);
      return `<section class="card"><span class="chip stamp" style="align-self:flex-start">${s.name}</span><p class="q">${esc(s.q)}</p>
    <div class="choices">${s.c.map((t, i) => `<button class="choice" type="button" data-act="pick" data-i="${i}" aria-pressed="${st.pick === i}"><span class="k">${"ABC"[i]}</span><span>${esc(t)}</span></button>`).join("")}</div></section>
  <button class="btn" data-act="answer" ${st.pick === null ? "disabled" : ""}>回答する</button>
  <button class="btn ghost" data-act="rally" style="border-color:var(--line);color:var(--muted)">もどる</button>`;
    }
    function resultView() {
      const s = SPOTS.find(x => x.id === st.spot); const ok = st.stamps[s.id] && st.stamps[s.id].ok; const n = count();
      return `<section class="card result"><div class="verdict ${ok ? "ok" : "ng"}">${ok ? "正解！" : "おしい！"}</div>
    <div class="big-stamp"><div><b>${s.id}</b><span>STAMP</span></div></div><p><b>${s.name}のスタンプを獲得しました</b></p><div class="expl">${esc(s.ex)}</div><div style="width:100%">${stampRow()}</div></section>
  <button class="btn" data-act="${n === 5 ? "complete" : "rally"}">${n === 5 ? "景品の抽選に進む" : "ラリーにもどる"}</button>`;
    }
    function completeView() {
      return `<section class="hero"><div class="ring"></div><span class="tag">COMPLETE</span><h1>5つ全部あつめました！</h1><p>おめでとうございます。景品の抽選に参加できます。</p></section>
  <section class="card"><h2 style="font-size:17px">景品の抽選について</h2>
    ${st.email ? `<div class="notice">登録しました：<b>${esc(st.email)}</b></div><button class="btn ghost" data-act="editmail">アドレスを変更する</button>` : `
    <form id="mailform" novalidate><label class="f" for="mail">大学のメールアドレス<input id="mail" type="email" inputmode="email" autocomplete="email"></label><p class="err" id="mailerr" role="alert"></p><button class="btn" type="submit">登録する</button></form>`}
  </section><button class="btn ghost" data-act="rally" style="border-color:var(--line);color:var(--muted)">もどる</button>`;
    }

    function adminRows() {
      const you = { id: st.id + " (あなた)", s: SPOTS.map(x => st.stamps[x.id] ? 1 : 0), mail: st.email, prize: st.prize, you: true };
      let rows = [you, ...others];
      rows = rows.map(r => ({ ...r, total: r.s.reduce((a, b) => a + b, 0) }));
      if (st.filter === "done") rows = rows.filter(r => r.total === 5);
      if (st.filter === "unex") rows = rows.filter(r => r.total === 5 && r.prize !== "done");
      if (st.q) rows = rows.filter(r => r.id.toLowerCase().includes(st.q.toLowerCase()));
      return rows;
    }
    function adminView() {
      if (!st.loggedIn) return `<section class="card login"><h2 style="font-size:18px">運営ログイン</h2>
    <form id="loginform"><label class="f" for="adm">運営用ID<input id="adm" type="text"></label><button class="btn" type="submit" style="margin-top:14px">ログイン</button></form></section>`;

      const all = [{ id: st.id, s: SPOTS.map(x => st.stamps[x.id] ? 1 : 0), prize: st.prize }, ...others].map(r => ({ ...r, t: r.s.reduce((a, b) => a + b, 0) }));
      const total = all.length, comp = all.filter(r => r.t === 5).length, done = all.filter(r => r.t === 5 && r.prize === "done").length;
      const rows = adminRows();
      return `<h1 style="font-size:20px">運営ダッシュボード</h1>
  <div class="stats"><div class="stat"><b>${total}</b><span>参加者</span></div><div class="stat"><b>${comp}</b><span>5か所達成</span></div><div class="stat"><b>${done}</b><span>景品 交換済</span></div><div class="stat"><b>${comp - done}</b><span>未交換</span></div></div>
  <div class="tools"><input type="search" id="q" placeholder="IDで探す" value="${esc(st.q)}">
    <div class="seg"><button type="button" data-f="all" aria-pressed="${st.filter === "all"}">全員</button><button type="button" data-f="done" aria-pressed="${st.filter === "done"}">達成</button><button type="button" data-f="unex" aria-pressed="${st.filter === "unex"}">未交換</button></div>
    <button class="xbtn" type="button" data-act="reload" style="background:var(--ok);color:#fff">データを更新</button>
    <button class="xbtn" type="button" data-act="csv">CSV出力</button>
  </div>
  <div class="tablebox"><table>
    <thead><tr><th>参加者ID</th>${SPOTS.map(s => `<th>S${s.id}</th>`).join("")}<th>合計</th><th>メール</th><th>景品</th><th></th></tr></thead>
    <tbody>${rows.length ? rows.map((r) => {
        const comp = r.total === 5, ex = r.prize === "done";
        return `<tr class="${r.you ? "you" : ""}">
        <td class="id">${esc(r.id)}</td>
        ${r.s.map(v => `<td><span class="dot ${v ? "on" : ""}"></span></td>`).join("")}
        <td class="num">${r.total}/5</td><td>${r.mail ? esc(r.mail) : '<span class="small">—</span>'}</td>
        <td>${!comp ? '<span class="chip">対象外</span>' : ex ? `<span class="chip ok">交換済${r.at ? " " + r.at : ""}</span>` : '<span class="chip warn">未交換</span>'}</td>
        <td>${comp ? (ex ? `<button class="xbtn" disabled>渡し済み</button>` : (st.confirmId === r.id ? `<button class="xbtn confirm" data-act="xchg" data-id="${esc(r.id)}">本当に渡した</button>` : `<button class="xbtn" data-act="xask" data-id="${esc(r.id)}">交換済みにする</button>`)) : ""}</td>
      </tr>`;
      }).join("") : `<tr><td colspan="10" class="small">該当なし</td></tr>`}</tbody>
  </table></div><div id="csvbox"></div>`;
    }

    function render() {
      const v = st.mode === "a" ? adminView() : ({ top: topView, rally: rallyView, quiz: quizView, result: resultView, complete: completeView }[st.screen])();
      document.getElementById("app").className = "wrap" + (st.mode === "a" && st.loggedIn ? " wide" : "");
      app.innerHTML = v;
      document.getElementById("tab-p").setAttribute("aria-pressed", st.mode === "p");
      document.getElementById("tab-a").setAttribute("aria-pressed", st.mode === "a");
      const mf = document.getElementById("mailform");
      if (mf) mf.addEventListener("submit", e => {
        e.preventDefault();
        const v = document.getElementById("mail").value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { document.getElementById("mailerr").textContent = "正しいメールアドレスを入力してください。"; return; }
        st.email = v; save(); render();
      });
      const lf = document.getElementById("loginform");
      if (lf) lf.addEventListener("submit", e => { e.preventDefault(); st.loggedIn = true; render(); loadAdminData(); });
      const q = document.getElementById("q");
      if (q) q.addEventListener("input", e => { st.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
    }

    document.addEventListener("click", e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.id === "tab-p") { st.mode = "p"; return render(); }
      if (t.id === "tab-a") { st.mode = "a"; return render(); }
      if (t.dataset.f) { st.filter = t.dataset.f; return render(); }
      const a = t.dataset.act; if (!a) return;

      if (a === "start" || a === "rally") return go("rally");
      if (a === "top") return go("top");
      if (a === "complete") return go("complete");
      if (a === "editmail") { st.email = ""; save(); return render(); }
      if (a === "arrive") return go("quiz", { spot: +t.dataset.id, pick: null });
      if (a === "pick") { st.pick = +t.dataset.i; return render(); }
      if (a === "answer") {
        const s = SPOTS.find(x => x.id === st.spot);
        if (!st.stamps[s.id]) { st.stamps[s.id] = { ok: st.pick === s.a }; save(); }
        return go("result");
      }
      if (a === "reload") { loadAdminData(); return; }
      if (a === "xask") { st.confirmId = t.dataset.id; return render(); }
      if (a === "xchg") {
        const id = t.dataset.id; const now = new Date(); const hm = now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
        let targetId = id;
        if (id.includes("(あなた)")) {
          targetId = st.id;
          if (st.prize !== "done") { st.prize = "done"; saveLocal(); }
        } else {
          const r = others.find(x => x.id === id); if (r && r.prize !== "done") { r.prize = "done"; r.at = hm; }
        }
        st.confirmId = null; render();
        if (GAS_URL.startsWith("http")) {
          fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'exchange', id: targetId, at: hm }) }).catch(e => console.error(e));
        }
        return;
      }
      if (a === "csv") {
        const rows = adminRows();
        const head = ["participant_id", ...SPOTS.map(s => "spot" + s.id), "total", "email", "prize_status"];
        const csv = [head, ...rows.map(r => [r.id.replace(" (あなた)", ""), ...r.s, r.total, r.mail || "", r.total === 5 ? (r.prize === "done" ? "交換済み" : "未交換") : "対象外"])].map(r => r.join(",")).join("\n");
        document.getElementById("csvbox").innerHTML = `<div class="card"><textarea id="csvta" readonly></textarea><button class="xbtn" type="button" data-act="copycsv">コピーする</button></div>`;
        document.getElementById("csvta").value = csv; return;
      }
      if (a === "copycsv") { navigator.clipboard.writeText(document.getElementById("csvta").value); alert("コピーしました"); }
    });
    render();
  </script>
</body>

</html>
